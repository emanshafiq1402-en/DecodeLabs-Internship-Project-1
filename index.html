<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DecodeBot – Rule-Based AI Chatbot</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--text:#1f2d22;--muted:#6b7a6e;--bot:#e6efe3;--me:#4f7a5a;--meText:#fff;--line:#d5e0d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121712;--card:#1b231c;--text:#e8f0e8;--muted:#93a595;--bot:#263226;--me:#5b8f67;--meText:#fff;--line:#2d3b2e}}
:root[data-theme="dark"]{--bg:#121712;--card:#1b231c;--text:#e8f0e8;--muted:#93a595;--bot:#263226;--me:#5b8f67;--meText:#fff;--line:#2d3b2e}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:560px;height:100%;background:var(--card)}
header{padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;word-wrap:break-word}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--me);color:var(--meText);align-self:flex-end;border-bottom-right-radius:4px}
.chips{padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;padding:5px 11px;font-size:13px;cursor:pointer}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
input{flex:1;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
.send{background:var(--me);color:var(--meText);border:0;border-radius:12px;padding:0 16px;font-size:15px;cursor:pointer}
input:disabled,.send:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header><h1>🤖 DecodeBot</h1><p>Rule-based AI chatbot · Project 1 · DecodeLabs</p></header>
<div id="chat"></div>
<div class="chips" id="chips"></div>
<div class="bar"><input id="box" placeholder="Type a message…" autocomplete="off"><button class="send" id="send">Send</button></div>
</div>
<script>
// KNOWLEDGE BASE (same idea as the Python dictionary)
const responses = {
"hello":"Hi there! How can I help you today?","hi":"Hello! Nice to meet you.","hey":"Hey! What’s up?",
"good morning":"Good morning! Hope you have a productive day.","good afternoon":"Good afternoon! How’s your day going?",
"good evening":"Good evening! How was your day?","good night":"Good night! Sleep well.",
"whats up":"Just waiting to chat with you!","sup":"All good here! What about you?",
"how are you":"I’m just a bot, but I’m running perfectly!","what is your name":"I’m DecodeBot, your first rule-based chatbot.",
"who are you":"I’m DecodeBot, a rule-based AI chatbot.","who made you":"I was built by an AI intern at DecodeLabs.",
"are you human":"Nope, I’m a program made of if-else logic and a dictionary.","are you a robot":"Yes, a simple rule-based one!",
"how old are you":"I was created today, so I’m brand new!","where do you live":"Inside your browser, in a JavaScript file.",
"what can you do":"I can chat about basic things. Type help to see examples.",
"help":"Try: hello, how are you, what is your name, joke, fun fact, motivate me, what is ai, what is python, thanks, or bye.",
"what is ai":"AI (Artificial Intelligence) is when machines do tasks that normally need human intelligence.",
"what is python":"Python is a beginner-friendly programming language used a lot in AI.",
"what is a chatbot":"A chatbot is a program that talks with users through text or voice.",
"what is machine learning":"Machine learning is when computers learn patterns from data instead of fixed rules.",
"what is rule based":"Rule-based means the bot follows fixed if-else rules written by a programmer.",
"what is a dictionary":"A dictionary stores key-value pairs, like hello → Hi there!",
"what is a loop":"A loop repeats code again and again until a condition stops it.",
"what is github":"GitHub is a website where developers store and share their code.",
"what is decodelabs":"DecodeLabs is the platform where I was built as an internship project.",
"joke":"Why do programmers prefer dark mode? Because light attracts bugs!",
"another joke":"Why did the developer go broke? Because he used up all his cache!",
"fun fact":"The first computer bug was a real moth found inside a computer in 1947.",
"motivate me":"Every expert was once a beginner. Keep building!",
"tell me something":"Python is named after Monty Python, not the snake!",
"i am bored":"Let’s fix that! Ask me for a joke or a fun fact.",
"i am sad":"I’m sorry to hear that. Take a deep breath, things will get better.",
"i am happy":"That’s awesome! Keep smiling!","i love you":"Aww, thank you! I’m just a bot, but you’re great.",
"thanks":"You’re welcome!","thank you":"Happy to help!","ok":"Alright!","okay":"Cool!","nice":"Glad you like it!",
"cool":"Thanks!","sorry":"No problem at all!","yes":"Great!","no":"Okay, no worries.","lol":"Haha, glad you’re having fun!"
};
const EXIT = ["bye","exit","quit","goodbye","see you","stop"];
const FALLBACK = "Sorry, I do not understand. Type help to see what I know.";

// PHASE 1: sanitization
const sanitize = t => t.toLowerCase().trim().replace(/[!?.,'’]/g,"").split(/\s+/).filter(Boolean).join(" ");

const chat = document.getElementById("chat"), box = document.getElementById("box"), send = document.getElementById("send");
function add(text, who){ const d=document.createElement("div"); d.className="m "+who; d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }

// PHASE 2 + 3: process and output
function handle(raw){
  const clean = sanitize(raw);
  if(!clean){ add("Please type something.","bot"); return; }
  if(EXIT.includes(clean)){
    add("Goodbye! Have a great day!","bot");
    box.disabled = send.disabled = true;
    const r=document.createElement("button"); r.textContent="Restart chat"; r.className="send"; r.style.cssText="padding:8px 14px;margin:6px auto";
    r.onclick=()=>{chat.innerHTML="";box.disabled=send.disabled=false;add("Hello! Type help to see what I can do.","bot");box.focus();};
    chat.appendChild(r); chat.scrollTop=chat.scrollHeight; return;
  }
  add(responses[clean] ?? FALLBACK, "bot");   // lookup + fallback, like dict.get()
}
function submit(t){ const v=(t??box.value); if(!v.trim()) return; add(v,"me"); box.value=""; setTimeout(()=>handle(v),250); }
send.onclick=()=>submit(); box.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
const chips=document.getElementById("chips");
["hello","joke","fun fact","what is ai","help","bye"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>submit(c);chips.appendChild(b);});
add("Hello! Type help to see what I can do. Type bye to exit.","bot");
</script>
</body>
</html>
